name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    # Pin the isolation test host instead of inheriting ubuntu-latest namespace policy.
    # A real namespace probe below is mandatory; unsupported hosts fail the job.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install isolation test dependencies
        run: sudo apt-get update && sudo apt-get install -y bubblewrap tmux
      - name: Verify isolation support
        run: bwrap --unshare-all --die-with-parent --ro-bind / / /bin/true
      - name: Install
        run: npm ci
      - name: Verify
        run: npm run verify
