# Agent config: Codex CLI
# Sourced by tmux-bridge bin/ scripts.
# No absolute paths, no secrets, no private IDs.

AGENT_BIN="codex"
AGENT_SUBMIT_KEY="C-m"
AGENT_PROMPT_CHAR="›"
MESH_AGENT_NAME="codex"
MESH_AGENT_CAPABILITIES="code,review,plan"
AGENT_SUPPORTS_LAUNCH_TITLE="true"

# First-class launch knobs. Values are expanded by agent-session.sh; raw flags
# after `--` are appended later and therefore remain the strongest override.
AGENT_SUPPORTS_MODEL="true"
AGENT_MODEL_ARGS=(-c "model={VALUE}")
AGENT_SUPPORTS_EFFORT="true"
AGENT_EFFORT_ARGS=(-c "model_reasoning_effort={VALUE}")

# Mesh workers are pinned independently from the desktop-selected config. Set
# CODEX_MESH_PIN=0 to follow the desktop config, or replace either default with
# CODEX_MESH_MODEL / CODEX_MESH_EFFORT.
AGENT_PIN_ENABLE_ENV="CODEX_MESH_PIN"
AGENT_PIN_DEFAULT_MODEL="gpt-5.6-terra"
AGENT_PIN_DEFAULT_EFFORT="high"
AGENT_PIN_MODEL_ENV="CODEX_MESH_MODEL"
AGENT_PIN_EFFORT_ENV="CODEX_MESH_EFFORT"

# Best-effort, read-only model discovery for mesh-models.sh. Codex has no
# model-list command, so its config.toml is the advertised-model signal: the
# new-model availability keys, migration targets, and current default model.
# Keep the command config-driven; mesh-models.sh never writes this file.
AGENT_MODELS_PROBE_CMD='
config="${CODEX_HOME:-$HOME/.codex}/config.toml"
[[ -r "$config" ]] || exit 0
python3 - "$config" <<PY
import re
import sys

try:
    lines = open(sys.argv[1], encoding="utf-8")
except OSError:
    raise SystemExit(0)

section = ""
models = set()
for raw_line in lines:
    line = raw_line.strip()
    if not line or line.startswith("#"):
        continue
    header = re.match(r"^\[([^\]]+)\]\s*(?:#.*)?$", line)
    if header:
        section = header.group(1).strip()
        continue
    if section == "tui.model_availability_nux":
        match = re.match(r"^(?:\"([^\"]+)\"|([A-Za-z0-9._-]+))\s*=", line)
        if match:
            models.add(match.group(1) or match.group(2))
    elif section == "notice.model_migrations":
        match = re.match(r"^(?:\"[^\"]+\"|[A-Za-z0-9._-]+)\s*=\s*\"([^\"]+)\"", line)
        if match:
            models.add(match.group(1))
    elif not section:
        match = re.match(r"^model\s*=\s*\"([^\"]+)\"", line)
        if match:
            models.add(match.group(1))

for model in sorted(models):
    print(model)
PY
'

# Regex: session is still processing
AGENT_WORKING_PATTERN="Working|Reconnecting|esc to interrupt"

# Regex: session is idle and ready for input
AGENT_IDLE_PATTERN="gpt-|o[0-9] |claude-"

# Regex: evidence that the pane is a Codex TUI, not the shell left behind after
# a crashed CLI. agent-send.sh checks this before every paste and submit retry.
AGENT_ALIVE_PATTERN="${AGENT_WORKING_PATTERN}|${AGENT_IDLE_PATTERN}|${AGENT_PROMPT_CHAR}"
AGENT_ALIVE_PROCESS_PATTERN="^codex$"

# Regex: explicit "turn finished" marker (used by agent-wait.sh for robust completion detection)
AGENT_DONE_PATTERN="Worked for"

# Codex Desktop visibility: when an app-server socket is live, connect the TUI to it
# via --remote so bridge sessions also appear inside Codex Desktop. This is now
# AUTOMATIC — no need to remember to export CODEX_REMOTE_SOCK. Precedence:
#   * CODEX_REMOTE_SOCK already set (even to "") → respected verbatim (your override)
#   * CODEX_NO_REMOTE=1                          → force standalone, tmux-only session
#   * otherwise                                  → auto-detect the first LISTENING socket
# We must test that the socket is actually listening, not merely present: a stale
# socket file (e.g. a leftover SSH-tunnel websocket) makes `codex --remote` fail with
# "failed to connect to remote app server". Candidates are tried in order; if none is
# live we fall back to a standalone tmux-only session instead of failing the launch.
# Verified: --remote coexists with -c overrides (e.g. model_reasoning_effort=xhigh).
if [[ -z "${CODEX_REMOTE_SOCK+x}" && -z "${CODEX_NO_REMOTE:-}" ]]; then
    for _codex_sock in \
        "${HOME}/.codex/app-server-control/desktop-ssh-websocket-v0.sock" \
        "${HOME}/.codex/app-server-control/app-server-control.sock"; do
        if [[ -S "$_codex_sock" ]] && ss -lx 2>/dev/null | grep -qF "$_codex_sock"; then
            CODEX_REMOTE_SOCK="$_codex_sock"
            break
        fi
    done
    unset _codex_sock
fi

# Resume an existing on-disk session ({SESSION_ID} is substituted by agent-session.sh).
AGENT_RESUME_CMD="codex resume {SESSION_ID}${CODEX_REMOTE_SOCK:+ --remote unix://$CODEX_REMOTE_SOCK}"

# Whether the CLI shows a cwd-picker after resume (send Enter to auto-confirm)
AGENT_HAS_CWD_PICKER="true"
AGENT_PICKER_PATTERN="Use session directory"

# Launch a new session. {CWD} is substituted by agent-session.sh with the resolved
# working directory. In remote mode the app-server ignores `tmux -c`, so we pass
# --cd to pin codex to the requested directory (harmless in local mode too). This
# keeps the session both rooted in the right project AND visible from Codex Desktop.
AGENT_NEW_CMD="codex${CODEX_REMOTE_SOCK:+ --remote unix://$CODEX_REMOTE_SOCK} --cd \"{CWD}\""

# On-disk session store root
AGENT_SESSION_DIR="${HOME}/.codex/sessions"

# One-liner to extract the cwd from a session JSONL file (receives file path as $1)
AGENT_SESSION_CWD_EXTRACTOR='python3 -c "
import json, sys
for line in open(sys.argv[1]):
    try:
        d = json.loads(line)
        if d.get(\"type\") == \"session_meta\":
            print(d[\"payload\"].get(\"cwd\", \"?\"))
            break
    except: pass
"'
