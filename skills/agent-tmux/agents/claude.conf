# Agent config: Claude Code CLI
# Sourced by tmux-bridge bin/ scripts.
# No absolute paths, no secrets, no private IDs.

AGENT_BIN="claude"
AGENT_SUBMIT_KEY="Enter"
AGENT_PROMPT_CHAR="❯"
MESH_AGENT_NAME="claude"
MESH_AGENT_CAPABILITIES="code,review,docs,research"

# First-class launch knobs map directly to Claude's native CLI flags.
AGENT_SUPPORTS_MODEL="true"
AGENT_MODEL_ARGS=(--model "{VALUE}")
AGENT_MODEL_PASSTHRU_PATTERNS=("--model" "--model=*")
AGENT_SUPPORTS_EFFORT="true"
AGENT_EFFORT_ARGS=(--effort "{VALUE}")
AGENT_EFFORT_PASSTHRU_PATTERNS=("--effort" "--effort=*")

# Claude has no read-only available-models signal yet. Leave this absent so
# mesh-models.sh reports "no probe available" instead of inventing data.

# Regex: session is still processing (spinner chars + known in-progress text)
AGENT_WORKING_PATTERN="⠋|⠙|⠹|⠸|⠼|⠴|⠦|⠧|⠇|⠏|Thinking\.\.\."

# Regex: session is idle — "Brewed" appears when a turn completes; status bar shows effort level
AGENT_IDLE_PATTERN="Brewed for|✻|high ·|low ·|medium ·"

# No verified permission-dialog pattern for Claude Code yet: without
# AGENT_APPROVAL_PATTERN, status detection keeps its legacy idle/working/error
# behavior. Same for AGENT_SUPPORTS_APPROVAL_POLICY: the CLI only exposes
# --dangerously-skip-permissions, which this bridge refuses to map.

# Regex: evidence that the pane is a Claude TUI, not a bare shell.
AGENT_ALIVE_PATTERN="${AGENT_WORKING_PATTERN}|${AGENT_IDLE_PATTERN}|${AGENT_PROMPT_CHAR}"
AGENT_ALIVE_PROCESS_PATTERN="^claude$"

# A persisted Claude session may have only one interactive writer. Refuse a
# local resume when Claude Desktop / Remote Control already owns the session.
AGENT_REQUIRE_FREE_SESSION_WRITER="true"

# Resume an existing session locally. Remote Control is opt-in because each
# persistent tunnel consumes host resources until it is explicitly closed.
AGENT_RESUME_CMD="claude --resume {SESSION_ID}"

# Claude Code shows no cwd picker after --resume
AGENT_HAS_CWD_PICKER="false"
AGENT_PICKER_PATTERN=""

# Launch a new local session. Do not enable Remote Control by default.
AGENT_NEW_CMD="claude"

# On-disk session store root (organised by encoded project path)
AGENT_SESSION_DIR="${HOME}/.claude/projects"

# One-liner to extract the cwd from a session JSONL file (Claude encodes it in the dir name)
AGENT_SESSION_CWD_EXTRACTOR='python3 -c "
import sys, os
path = sys.argv[1]
dirname = os.path.basename(os.path.dirname(path))
print(\"//\" + dirname.replace(\"-\", \"/\").lstrip(\"/\"))
"'
